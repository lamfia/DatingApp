<div class="flex justify-center gap-3 pt-10">

    <button type="button" class="btn btn-neutral" (click)="get500Error()">
        TEST 500
    </button>

    <button type="button" class="btn btn-primary" (click)="get400Error()">
        TEST 400
    </button>
    <button type="button" class="btn btn-accent" (click)="get401Error()">
        TEST 401
    </button>

    <button type="button" class="btn btn-secondary" (click)="get404Error()">
        TEST 404
    </button>

    <button type="button" class="btn btn-info" (click)="get400ValidationError()">
        TEST 400 VALIDA
    </button>

</div>

@if (validationErrors().length >0) {

<div class="card bg-base-100 flex mt-5 rounded-2xl w-1/2 p-3 mx-auto">

    <ul class="flex flex-col text-red-600 space-y-2">

        @for (error of validationErrors(); track $index) {
        <li>
            {{error}}
        </li>
        }

    </ul>

</div>
}
